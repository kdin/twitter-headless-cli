[project]
name = "twitter-headless-cli"
version = "0.1.0"
description = "A CLI tool to browse Twitter in headless mode and retrieve timeline tweets"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40.0",
    "click>=8.1.0",
]

[project.scripts]
twitter-cli = "twitter_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twitter_cli"]
